<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IndexLab</title>
  <meta name="description" content="IndexLab — kursy do matury rozszerzonej (WOS i historia): fiszki z powtórkami, lekcje, zadania i próbne matury. Działa offline.">
  <meta name="theme-color" content="#F1F2F1">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IndexLab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikony/ikona.svg" type="image/svg+xml">
  <link rel="icon" href="ikony/ikona-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="ikony/apple-touch-icon.png">
  <link rel="preload" href="fonty/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Motyw ustawiony przed pierwszym malowaniem, żeby nie migało.
    try {
      var pr = JSON.parse(localStorage.getItem('kolumb.profile') || 'null');
      var t = JSON.parse(localStorage.getItem(pr ? 'kolumb.v1.' + pr.active : 'kolumb.v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#app">Przejdź do treści</a>
  <header class="topbar">
    <a class="subj-btn" id="subj-btn" href="#/przedmiot" aria-label="IndexLab — zmień przedmiot"></a>
    <div class="top-stats" id="top-stats"></div>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading" aria-live="polite">
      <img src="ikony/ikona.svg" alt="" width="72" height="72">
      <p>Ładowanie…</p>
    </div>
    <noscript><p class="alert">IndexLab wymaga włączonego JavaScriptu.</p></noscript>
  </main>

  <nav class="tabbar" aria-label="Nawigacja główna">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Dziś</span>
    </a>
    <a href="#/nauka" data-tab="nauka">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.8 8.2 13.4 13.4 8.2 15.8 10.6 10.6Z" fill="currentColor"/></svg>
      <span>Nauka</span>
    </a>
    <a href="#/matura" data-tab="matura">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Matura</span>
    </a>
    <a href="#/aktualnosci" data-tab="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2h-1M7.5 9h6M7.5 12.5h6M7.5 16h3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Aktualności</span>
    </a>
    <a href="#/profil" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Profil</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
